server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The SPA calls /api on its own origin. In production the host nginx routes
    # /api to the backend first; this proxy keeps the app fully functional when
    # the frontend container is reached directly (local testing, or any setup
    # without a separate API upstream), and makes that path testable.
    # The upstream is set via a variable so nginx resolves `backend` at request
    # time (Docker's embedded DNS) instead of failing to start outside compose.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_api http://backend:5000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # SPA history fallback (react-router BrowserRouter).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
